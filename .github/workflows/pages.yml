name: Deploy Comuno Lab site to GitHub Pages

# Manual only — does not run automatically, so it can't email failures.
# (Optional: only works once GitHub Pages is enabled in repo Settings → Pages.)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site (comuno-lab folder)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./comuno-lab
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
